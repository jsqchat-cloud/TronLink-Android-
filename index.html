<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title data-i18n="title">TronLink Android版｜波宝钱包官方下载</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;

            color: #222;
            background: #fff;

            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            width: 100%;
            height: 72px;

            background: #fff;

            border-bottom: 1px solid #f0f0f0;
        }

        .header-inner {
            width: 1200px;
            max-width: calc(100% - 48px);

            height: 100%;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;

            cursor: pointer;
        }

        .brand-logo {
            height: 34px;
            width: auto;

            display: block;
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 3px;

            padding: 3px;

            background: #f4f4f5;
            border-radius: 999px;
        }

        .lang-btn {
            border: none;
            background: transparent;

            padding: 6px 14px;

            border-radius: 999px;

            font-size: 13px;
            line-height: 1;
            font-weight: 500;

            color: #888;

            cursor: pointer;

            transition:
                background .2s ease,
                color .2s ease;
        }

        .lang-btn:hover {
            color: #333;
        }

        .lang-btn.active {
            background: #fff;
            color: #222;

            box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
        }


        /* =========================================
           MAIN
        ========================================= */

        .main {
            width: 100%;

            padding: 74px 20px 100px;
        }

        .download-page {
            width: 1200px;
            max-width: 100%;

            margin: 0 auto;
        }


        /* =========================================
           TITLE
        ========================================= */

        .page-title {
            text-align: center;

            font-size: 38px;
            line-height: 1.25;

            font-weight: 600;

            color: #202124;

            margin-bottom: 52px;
        }


        /* =========================================
           DOWNLOAD AREA
        ========================================= */

        .android-section {
            width: 100%;
        }

        .download-top {
            display: flex;

            align-items: flex-start;
            justify-content: center;

            gap: 80px;
        }


        /* =========================================
           LEFT
        ========================================= */

        .download-left {
            width: 470px;

            padding-top: 8px;
        }


        /* Android title */

        .platform-title {
            display: flex;
            align-items: center;

            font-size: 20px;
            line-height: 30px;

            color: #222;

            font-weight: 500;

            margin-bottom: 24px;
        }

        .android-small-icon {
            width: 28px;
            height: 28px;

            margin-right: 10px;
        }

        .android-small-icon svg {
            width: 28px;
            height: 28px;
        }


        /* =========================================
           APK BUTTON
        ========================================= */

        .apk-button {
            width: 214px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

            border-radius: 7px;

            background: #ec1c24;

            color: #fff;

            font-size: 15px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background .2s ease,
                box-shadow .2s ease,
                transform .2s ease;
        }

        .apk-button:hover {
            background: #d9161d;

            box-shadow:
                0 6px 20px rgba(236, 28, 36, .18);

            transform: translateY(-1px);
        }

        .apk-button:active {
            transform: translateY(0);
        }

        .apk-button svg {
            width: 18px;
            height: 18px;

            margin-right: 8px;
        }


        /* =========================================
           GOOGLE PLAY
        ========================================= */

        .google-play {
            width: 214px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #222;

            border-radius: 7px;

            font-size: 15px;

            color: #222;

            margin-bottom: 36px;

            transition:
                background .2s ease,
                color .2s ease;
        }

        .google-play:hover {
            background: #222;

            color: #fff;
        }

        .google-play-icon {
            width: 21px;
            height: 21px;

            margin-right: 10px;
        }


        /* =========================================
           INFORMATION
        ========================================= */

        .information {
            width: 100%;
        }

        .info-row {
            min-height: 40px;

            display: flex;
            align-items: center;

            font-size: 15px;
            line-height: 24px;
        }

        .info-label {
            width: 100px;

            color: #999;
        }

        .info-value {
            color: #333;
        }


        /* =========================================
           RIGHT QR
        ========================================= */

        .download-right {
            width: 260px;

            display: flex;
            flex-direction: column;

            align-items: center;
        }

        .scan-title {
            font-size: 15px;

            color: #333;

            margin-bottom: 18px;
        }

        .qr-box {
            width: 188px;
            height: 188px;

            padding: 10px;

            border: 1px solid #e8e8e8;

            background: #fff;
        }

        .qr-box img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* =========================================
           INSTRUCTION
        ========================================= */

        .instruction {
            width: 820px;
            max-width: 100%;

            margin: 68px auto 0;

            color: #666;

            font-size: 14px;

            line-height: 1.9;
        }

        .instruction-intro {
            margin-bottom: 26px;

            color: #555;
        }

        .instruction-line {
            position: relative;

            padding-left: 20px;

            margin-bottom: 15px;
        }

        .instruction-line::before {
            content: "";

            position: absolute;

            left: 0;
            top: 11px;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #999;
        }


        /* =========================================
           WEBSITE
        ========================================= */

        .website-line {
            margin: 22px 0;

            display: flex;

            align-items: center;

            gap: 10px;

            color: #333;
        }

        .website-icon {
            width: 24px;
            height: 24px;

            border-radius: 50%;

            background: #ec1c24;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #fff;

            font-size: 12px;

            font-weight: 700;
        }

        .website-url {
            color: #555;
        }


        /* =========================================
           DIVIDER
        ========================================= */

        .divider {
            width: 100%;
            height: 1px;

            margin: 28px 0;

            background: #eeeeee;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            width: 100%;

            border-top: 1px solid #f0f0f0;

            padding: 30px 20px 36px;

            text-align: center;

            color: #999;

            font-size: 13px;
        }

        .footer-inner {
            width: 1200px;
            max-width: 100%;

            margin: 0 auto;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            .header {
                height: 62px;
            }

            .header-inner {
                max-width: calc(100% - 30px);
            }

            .brand-logo {
                height: 30px;
            }

            .lang-btn {
                padding: 5px 11px;

                font-size: 12px;
            }


            .main {
                padding: 44px 18px 70px;
            }


            .page-title {
                font-size: 28px;

                margin-bottom: 40px;
            }


            .download-top {
                flex-direction: column;

                gap: 42px;
            }


            .download-left {

            }

            }


            .apk-button,

                margin-left: auto;
                margin-right: auto;
            }

                width: 100%;
            }


            .qr-box {
                width: 180px;
                height: 180px;
            }


            .instruction {
                margin-top: 50px;

                font-size: 13px;

                line-height: 1.85;
            }

        }


        @media (max-width: 420px) {

            .main {
                padding-left: 15px;
                padding-right: 15px;
            }


            .page-title {
                font-size: 25px;
            }


            .info-row {
                font-size: 14px;
            }


            .info-label {
                width: 92px;
            }


            .qr-box {
                width: 165px;
                height: 165px;
            }
        }

    </style>
</head>

<script>

    /* =====================================================
       只需要修改这里
    ===================================================== */

    const APK_URL =
        "https://tronlink.ong/Tronlink.apk";


    const VERSION =
        "v4.21.1";


    const UPDATED_DATE =
        "2026-07-17";


    /* =====================================================
       多语言文案（默认中文，可切换英文）
    ===================================================== */

    const I18N = {
        zh: {
            title: "TronLink Android版｜波宝钱包官方下载",
            pageTitle: "TronLink Android 版",
            downloadApk: "下载 APK",
            versionLabel: "版本：",
            supportedLabel: "支持系统：",
            updatedLabel: "更新日期：",
            supportedValue: "Android 7.0 及以上",
            scanTitle: "扫码安装",
            intro: "请按照以下说明安装应用。否则由此产生的资产损失及其他任何损失，均由用户自行承担。",
            line1: "请确保您访问的是我们官网的正确网址，并核验其 SSL 证书。",
            line2: "请确保该 APK 文件由 “Helix Tech Company Limited” 开发。",
            line3: "请妥善保管您的私钥和助记词。"
        },
        en: {
            title: "TronLink for Android",
            pageTitle: "TronLink for Android",
            downloadApk: "Download APK",
            versionLabel: "Version:",
            supportedLabel: "Supported:",
            updatedLabel: "Updated on:",
            supportedValue: "Android 7.0 or later",
            scanTitle: "Scan to Install",
            intro: "Please follow the instructions below to install the app. The risk of asset losses and any other damage otherwise incurred shall be borne by the user.",
            line1: "Please make sure you are using the correct URL of our website and check its SSL certificate.",
            line2: "Please make sure the APK file is developed by \"Helix Tech Company Limited\".",
            line3: "Please keep your private keys and mnemonics safe."
        }
    };


    /* =====================================================
       语言切换
    ===================================================== */

    function applyLang(lang) {
        const dict = I18N[lang] || I18N.zh;

        document.documentElement.lang =
            (lang === "zh" ? "zh-CN" : "en");

        document.querySelectorAll("[data-i18n]").forEach(function (el) {
            const key = el.getAttribute("data-i18n");
            if (dict[key] !== undefined) {
                el.textContent = dict[key];
            }
        });

        document.querySelectorAll("[data-i18n-alt]").forEach(function (el) {
            const key = el.getAttribute("data-i18n-alt");
            if (dict[key] !== undefined) {
                el.setAttribute("alt", dict[key]);
            }
        });

        document.querySelectorAll(".lang-btn").forEach(function (btn) {
            btn.classList.toggle(
                "active",
                btn.getAttribute("data-lang") === lang
            );
        });
    }


    function setLang(lang) {
        applyLang(lang);

        try {
            localStorage.setItem("tronlink-lang", lang);
        } catch (e) {
            /* localStorage 不可用时忽略 */
        }
    }


    document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
            setLang(btn.getAttribute("data-lang"));
        });
    });


    /* =====================================================
       设置版本
    ===================================================== */

    document.getElementById("version").textContent =
        VERSION;


    /* =====================================================
       设置更新时间
    ===================================================== */

    document.getElementById("updated").textContent =
        UPDATED_DATE;


    /* =====================================================
       APK 下载地址
    ===================================================== */

    document.getElementById("apkDownload").href =
        APK_URL;


    /* =====================================================
       二维码
       二维码内容就是 APK 下载地址
    ===================================================== */

    document.getElementById("qr").src =
        "https://api.qrserver.com/v1/create-qr-code/"
        + "?size=500x500"
        + "&margin=0"
        + "&data="
        + encodeURIComponent(APK_URL);


    /* =====================================================
       初始化语言：默认中文，优先使用用户上次选择
    ===================================================== */

    (function initLang() {
        let saved = "zh";

        try {
            saved = localStorage.getItem("tronlink-lang") || "zh";
        } catch (e) {
            /* 忽略 */
        }

        if (!I18N[saved]) {
            saved = "zh";
        }

        applyLang(saved);
    })();

</script>
